<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Savings Plans 약정 규모의 설정 기준</title><desc id="desc">EC2와 Fargate 예상 사용금액을 계산해 약 80퍼센트를 Savings Plans 약정 대상으로 정하고 나머지 약 20퍼센트는 온디맨드로 운영한 기준. 실제 할인율이나 절감률을 뜻하지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="540" fill="white"/><g font-family="Arial, sans-serif" fill="#193832"><text x="60" y="48" font-size="18" font-weight="600" fill="#136d58" text-anchor="start">COMMITMENT PLANNING</text><rect x="60" y="85" width="490" height="155" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><image x="88" y="120" width="64" height="64" href="data:image/svg+xml;base64,"/><image x="172" y="120" width="64" height="64" href="data:image/svg+xml;base64,"/><text x="266" y="144" font-size="27" font-weight="600" fill="#193832" text-anchor="start">EC2 + Fargate</text><text x="266" y="190" font-size="22" font-weight="400" fill="#69766e" text-anchor="start">Expected usage cost</text><rect x="770" y="85" width="370" height="155" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><image x="798" y="120" width="64" height="64" href="data:image/svg+xml;base64,"/><text x="884" y="144" font-size="26" font-weight="600" fill="#193832" text-anchor="start">Savings Plans</text><text x="884" y="190" font-size="22" font-weight="400" fill="#69766e" text-anchor="start">Commitment</text><path d="M550 163H760" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><text x="655" y="137" font-size="22" font-weight="400" fill="#527165" text-anchor="middle">80% target</text><text x="60" y="305" font-size="18" font-weight="600" fill="#69766e" text-anchor="start">EXPECTED USAGE COST</text><rect x="60" y="338" width="864" height="100" fill="#136d58"/><rect x="924" y="338" width="216" height="100" fill="#e5ede4"/><text x="88" y="378" font-size="25" font-weight="600" fill="#fff" text-anchor="start">Savings Plans</text><text x="88" y="417" font-size="29" font-weight="600" fill="#fff" text-anchor="start">80%</text><text x="1032" y="378" font-size="22" font-weight="600" fill="#193832" text-anchor="middle">On-Demand</text><text x="1032" y="417" font-size="29" font-weight="600" fill="#193832" text-anchor="middle">20%</text></g></svg>