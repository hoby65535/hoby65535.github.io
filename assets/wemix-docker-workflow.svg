<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Dockerfile과 Docker Compose 활용</title><desc id="desc">직접 작성한 Dockerfile로 이미지를 구성하고 Docker Compose로 컨테이너 실행 구성을 관리한 작업의 개념도입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="630" fill="white"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" font-size="18" font-weight="600" fill="#136d58" text-anchor="start">DOCKER · IMAGE &amp; RUNTIME CONFIGURATION</text><rect x="60" y="115" width="300" height="155" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><text x="88" y="164" font-size="30" font-weight="600" fill="#193832" text-anchor="start">Dockerfile</text><text x="88" y="213" font-size="23" font-weight="400" fill="#69766e" text-anchor="start">Direct authoring</text><rect x="450" y="115" width="290" height="155" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><text x="595" y="164" font-size="26" font-weight="600" fill="#193832" text-anchor="middle">Container image</text><text x="595" y="213" font-size="24" font-weight="400" fill="#69766e" text-anchor="middle">Docker</text><rect x="60" y="385" width="300" height="155" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><text x="88" y="434" font-size="29" font-weight="600" fill="#193832" text-anchor="start">Compose file</text><text x="88" y="483" font-size="22" font-weight="400" fill="#69766e" text-anchor="start">Runtime configuration</text><rect x="850" y="115" width="290" height="425" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2" stroke-dasharray="8 6"/><text x="995" y="166" font-size="20" font-weight="600" fill="#136d58" text-anchor="middle">DOCKER</text><text x="995" y="238" font-size="26" font-weight="600" fill="#193832" text-anchor="middle">Node / service</text><text x="995" y="283" font-size="26" font-weight="600" fill="#193832" text-anchor="middle">containers</text><text x="995" y="385" font-size="25" font-weight="400" fill="#69766e" text-anchor="middle">Run</text><text x="995" y="430" font-size="25" font-weight="400" fill="#69766e" text-anchor="middle">Manage</text><text x="995" y="475" font-size="25" font-weight="400" fill="#69766e" text-anchor="middle">Operate</text><path d="M360 192H440" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><text x="404" y="168" font-size="20" font-weight="400" fill="#527165" text-anchor="middle">Build</text><path d="M740 192H840" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="168" font-size="20" font-weight="400" fill="#527165" text-anchor="middle">Run</text><path d="M360 463H840" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><text x="595" y="438" font-size="24" font-weight="400" fill="#527165" text-anchor="middle">Docker Compose</text></g></svg>