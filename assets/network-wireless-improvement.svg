<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">현장 조사와 피드백 기반 무선 개선</title><desc id="desc">현장 조사와 사용자 피드백을 반영해 사무실 무선 네트워크 성능을 개선한 흐름입니다. 조사 수치나 AP 배치 위치는 포함하지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" text-anchor="start" font-size="18" font-weight="600" fill="#136d58">WI-FI · SURVEY &amp; USER FEEDBACK</text><rect x="60" y="110" width="330" height="145" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="225.0" y="182.5" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Site Survey</text><text x="225.0" y="222.5" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Office environment</text><rect x="60" y="365" width="330" height="145" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="225.0" y="437.5" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">User feedback</text><text x="225.0" y="477.5" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Usage experience</text><rect x="500" y="230" width="290" height="170" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="645.0" y="315.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Wi-Fi tuning</text><text x="645.0" y="355.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Network improvement</text><path d="M390 182H445V315H490" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><path d="M390 438H445V315H490" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="230" width="250" height="170" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="1015.0" y="315.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Office Wi-Fi</text><text x="1015.0" y="355.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Operational use</text><path d="M790 315H880" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="607" text-anchor="start" font-size="21" font-weight="400" fill="#69766e">Survey findings and feedback informed improvements in the working environment.</text></g></svg>