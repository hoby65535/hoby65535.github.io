<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">사내 운영 도구별 점검 대상</title><desc id="desc">사내 네트워크 모니터링, AWS 비용 이상 감지, 인스턴스·서비스·WAF 정기 점검 도구의 구현 범위를 보여줍니다. 실제 UI나 내부 연동 구조는 아닙니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" text-anchor="start" font-size="18" font-weight="600" fill="#136d58">INTERNAL TOOLS · MONITORING COVERAGE</text><rect x="60" y="100" width="460" height="130" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="290.0" y="165.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Network monitoring</text><text x="290.0" y="205.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Internal tool</text><rect x="680" y="100" width="460" height="130" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="910.0" y="165.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Office network</text><text x="910.0" y="205.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Network status</text><path d="M680 165H530" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="60" y="270" width="460" height="130" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="290.0" y="335.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Cost anomaly detection</text><text x="290.0" y="375.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Internal tool</text><rect x="680" y="270" width="460" height="130" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="910.0" y="335.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">AWS costs</text><text x="910.0" y="375.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Anomaly signals</text><path d="M680 335H530" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="60" y="440" width="460" height="130" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="290.0" y="505.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Scheduled checks</text><text x="290.0" y="545.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Weekly morning checks</text><rect x="680" y="440" width="460" height="130" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="910.0" y="505.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Instance / Service / WAF</text><text x="910.0" y="545.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Operational signals</text><path d="M680 505H530" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/></g></svg>