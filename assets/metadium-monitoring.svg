<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Metadium 메인넷 운영과 모니터링</title><desc id="desc">AWS 환경의 Linux 블록체인 노드를 운영·업데이트하고 Datadog과 Zabbix로 상태를 확인한 운영 범위입니다. 노드 수와 수집 방식은 나타내지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="630" fill="white"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" font-size="18" font-weight="600" fill="#136d58" text-anchor="start">METADIUM · NODE OPERATIONS</text><rect x="60" y="90" width="650" height="330" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2" stroke-dasharray="8 6"/><text x="88" y="135" font-size="22" font-weight="600" fill="#69766e" text-anchor="start">AWS</text><rect x="105" y="170" width="560" height="200" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><text x="385" y="225" font-size="32" font-weight="600" fill="#193832" text-anchor="middle">Metadium mainnet</text><text x="385" y="278" font-size="25" font-weight="400" fill="#69766e" text-anchor="middle">Linux-based blockchain nodes</text><text x="385" y="328" font-size="23" font-weight="400" fill="#136d58" text-anchor="middle">Operations / updates</text><rect x="860" y="110" width="280" height="130" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><text x="1000" y="166" font-size="30" font-weight="600" fill="#193832" text-anchor="middle">Datadog</text><text x="1000" y="209" font-size="23" font-weight="400" fill="#69766e" text-anchor="middle">Monitoring</text><rect x="860" y="290" width="280" height="130" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><text x="1000" y="346" font-size="30" font-weight="600" fill="#193832" text-anchor="middle">Zabbix</text><text x="1000" y="389" font-size="23" font-weight="400" fill="#69766e" text-anchor="middle">Monitoring</text><path d="M710 255H780V175H850" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M710 255H780V355H850" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="60" y="490" width="1080" height="95" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><text x="600" y="533" font-size="28" font-weight="600" fill="#193832" text-anchor="middle">Monitor node / infrastructure status</text><text x="600" y="567" font-size="22" font-weight="400" fill="#69766e" text-anchor="middle">Status checks · Issue investigation · Operational maintenance</text></g></svg>