<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">사내 보안 운영 영역</title><desc id="desc">EDR과 DLP의 운영 목적, VPN 운영과 Linux·Windows 환경을 담당 범위 중심으로 정리했습니다. 제품 간 직접 연동은 나타내지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" text-anchor="start" font-size="18" font-weight="600" fill="#136d58">CORPORATE SECURITY · OPERATING DOMAINS</text><rect x="60" y="120" width="330" height="230" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="84" y="155" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">ENDPOINT</text><text x="225.0" y="235.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">EDR</text><text x="225.0" y="275.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Endpoint security</text><rect x="435" y="120" width="330" height="230" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="459" y="155" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">INFORMATION</text><text x="600.0" y="235.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">DLP</text><text x="600.0" y="275.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Data protection</text><rect x="810" y="120" width="330" height="230" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="834" y="155" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">CONNECTIVITY</text><text x="975.0" y="235.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">VPN</text><text x="975.0" y="275.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Network access</text><rect x="60" y="