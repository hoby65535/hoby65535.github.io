<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Terraform 코드와 State 관리</title><desc id="desc">Git 브랜치로 구분한 모듈 기반 코드와 Terraform Cloud Workspace별 State 관리를 구분한 관리 구조입니다. 브랜치와 Workspace의 일대일 연결이나 자동 실행은 나타내지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" text-anchor="start" font-size="18" font-weight="600" fill="#136d58">TERRAFORM · CODE &amp; STATE MANAGEMENT</text><rect x="60" y="110" width="500" height="165" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="84" y="145" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">CODE ORGANIZATION</text><text x="310.0" y="192.5" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Git branches</text><text x="310.0" y="232.5" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Infrastructure code</text><rect x="60" y="365" width="500" height="165" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="84" y="400" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">RESOURCE ORGANIZATION</text><text x="310.0" y="447.5" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Terraform modules</text><text x="310.0" y="487.5" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Network / Compute / Data</text><path d="M310 275V355" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/><rect x="680" y="110" width="460" height="420" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="704" y="145" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">STATE MANAGEMENT</text><text x="910.0" y="320.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Terraform Cloud</text><text x="910.0" y="360.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Workspace-scoped state</text><path d="M560 448H620V320H670" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="60" y="607" text-anchor="start" font-size="21" font-weight="400" fill="#69766e">Code organization and state management are shown separately.</text></g></svg>