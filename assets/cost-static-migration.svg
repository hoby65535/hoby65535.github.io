<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">정적 사이트의 EC2에서 S3 이전</title><desc id="desc">기존 EC2 정적 사이트를 S3로 이전하고 CloudFront와 ACM을 구성했습니다. Migration 화살표는 이전 관계이며, CloudFront에서 S3로 향하는 화살표는 오리진 접근 관계입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="700" fill="white"/><g font-family="Arial, sans-serif" fill="#193832"><text x="60" y="48" font-size="18" font-weight="600" fill="#136d58" text-anchor="start">STATIC WEBSITE MIGRATION</text><text x="60" y="97" font-size="19" font-weight="600" fill="#69766e" text-anchor="start">BEFORE</text><text x="700" y="97" font-size="19" font-weight="600" fill="#136d58" text-anchor="start">AFTER</text><rect x="60" y="300" width="440" height="160" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><image x="88" y="340" width="64" height="64" href="data:image/svg+xml;base64,"/><text x="176" y="368" font-size="29" font-weight="600" fill="#193832" text-anchor="start">Amazon EC2</text><text x="176" y="410" font-size="23" font-weight="400" fill="#69766e" text-anchor="start">Static websites</text><path d="M500 380H690" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="600" y="355" font-size="22" font-weight="400" fill="#527165" text-anchor="middle">Migration</text><rect x="700" y="125" width="440" height="140" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><rect x="700" y="300" width="440" height="140" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><rect x="700" y="500" width="440" height="140" rx="8" fill="#f7f8f5" stroke="#cdd7cf" stroke-width="2"/><image x="728" y="163" width="64" height="64" href="data:image/svg+xml;base64,"/><text x="816" y="193" font-size="29" font-weight="600" fill="#193832" text-anchor="start">ACM</text><text x="816" y="235" font-size="23" font-weight="400" fill="#69766e" text-anchor="start">TLS certificate</text><image x="728" y="338" width="64" height="64" href="data:image/svg+xml;base64,"/><text x="816" y="368" font-size="29" font-weight="600" fill="#193832" text-anchor="start">CloudFront</text><text x="816" y="410" font-size="23" font-weight="400" fill="#69766e" text-anchor="start">HTTPS delivery</text><image x="728" y="538" width="64" height="64" href="data:image/svg+xml;base64,"/><text x="816" y="568" font-size="29" font-weight="600" fill="#193832" text-anchor="start">Amazon S3</text><text x="816" y="610" font-size="23" font-weight="400" fill="#69766e" text-anchor="start">Static content</text><path d="M920 265V290" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M920 440V490" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)"/></g></svg>