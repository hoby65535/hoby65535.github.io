<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">마이키핀월렛 인증 대응 담당 범위</title><desc id="desc">VASP 신고와 ISMS 인증 심사 대응에서 수행한 보안 정책 수립·이행과 기술적 보안 조치, 2021년 ISMS 인증 취득 기여를 요약했습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" text-anchor="start" font-size="18" font-weight="600" fill="#136d58">MYKEYPIN WALLET · CERTIFICATION SUPPORT</text><rect x="60" y="110" width="1080" height="125" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="600.0" y="172.5" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">VASP filing / ISMS certification</text><text x="600.0" y="212.5" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Security requirements</text><rect x="60" y="325" width="500" height="150" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="310.0" y="400.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Security policies</text><text x="310.0" y="440.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Establish / Implement</text><rect x="640" y="325" width="500" height="150" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="890.0" y="400.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Technical measures</text><text x="890.0" y="440.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Service infrastructure</text><path d="M360 235V315" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M840 235V315" fill="none" stroke="#136d58" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="60" y="607"