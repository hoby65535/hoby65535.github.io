<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">대파 컨테이너 배포 자동화 프로세스</title>
<desc id="desc">Bitbucket Pipelines에서 컨테이너 이미지를 빌드해 Amazon ECR에 업로드하고, ECS Task 구성을 갱신합니다. Fargate 태스크는 ECR 이미지를 사용해 API, WebSocket, 알림 Consumer, AIChat, LLM Worker 서비스를 실행합니다.</desc>
