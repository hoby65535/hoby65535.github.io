<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">유선·무선·VPN 구성 영역</title><desc id="desc">L2·L3·L4 유선 네트워크, Meraki Wi-Fi 6 무선 네트워크, Client VPN과 IPSec VPN 구축 범위를 구분했습니다. 실제 장비 배치나 연결 순서가 아닙니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136d58"/></marker></defs><rect width="1200" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#193832"><text x="60" y="48" text-anchor="start" font-size="18" font-weight="600" fill="#136d58">OFFICE NETWORK · CONNECTIVITY DOMAINS</text><rect x="60" y="105" width="500" height="180" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="84" y="140" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">LAN</text><text x="310.0" y="195.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">L2 / L3 / L4</text><text x="310.0" y="235.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Wired network</text><rect x="640" y="105" width="500" height="180" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="664" y="140" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">WIRELESS</text><text x="890.0" y="195.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Cisco Meraki</text><text x="890.0" y="235.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">Wi-Fi 6</text><rect x="60" y="365" width="500" height="180" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="84" y="400" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">VPN</text><text x="310.0" y="455.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">Client VPN</text><text x="310.0" y="495.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">VPN environment</text><rect x="640" y="365" width="500" height="180" rx="10" fill="#f5f7f2" stroke="#cdd7cf" stroke-width="2"/><text x="664" y="400" text-anchor="start" font-size="16" font-weight="600" fill="#136d58">VPN</text><text x="890.0" y="455.0" text-anchor="middle" font-size="27" font-weight="600" fill="#193832">IPSec VPN</text><text x="890.0" y="495.0" text-anchor="middle" font-size="21" font-weight="400" fill="#69766e">VPN environment</text><text x="60" y="607" text-anchor="start" font-size="21" font-weight="400" fill="#69766e">Design &amp; build scope · Not a physical topology or equipment wiring diagram.</text></g></svg>